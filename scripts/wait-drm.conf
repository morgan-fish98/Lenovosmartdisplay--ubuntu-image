[Unit]
# The DSI panel probes late on this board (deferred probe chain through the
# PMIC).  Starting Weston before /dev/dri/card0 exists makes it die with
# "no drm device found" and the kiosk service never recovers, so wait for a
# connected DSI connector first.
After=amber-display-fix.service
Wants=amber-display-fix.service

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 180 ]; do [ "$(cat /sys/class/drm/card0-DSI-1/status 2>/dev/null)" = connected ] && exit 0; sleep 1; i=$((i+1)); done; exit 0'
